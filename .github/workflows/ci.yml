name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un push de plus sur une PR annule le run précédent : le job contient un build
# Next complet, les runs obsolètes s'empilent vite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Génère .next/types (PageProps, LayoutProps, RouteContext) que tsconfig
      # inclut : sans ça le typecheck tourne sur un set de fichiers différent du
      # local, où ces types existent déjà.
      - run: pnpm exec next typegen

      # next build écarte les diagnostics des *.test.ts (runTypeCheck.js, ignoreRegex
      # sur spec|test) : sans ce step, une erreur de type dans un test passe en prod.
      - run: pnpm typecheck

      - run: pnpm test

      # API_URL absente : la garde fail-fast de src/lib/env.ts est neutralisée
      # pendant phase-production-build.
      - run: pnpm build
